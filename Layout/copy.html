<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- google font Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="../Bootstrap5/bootstrap-5.0.2-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./index.css" />
    <script
      src="../Bootstrap5/bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>
    <title>Info Max Digital</title>
    <link rel="icon" href="https://www.infomaxdigital.com.au/images/logo.png" />
  </head>
  <body>
    <section class="position-relative">
      <!-- FULL-WIDTH BACKGROUND IMAGES -->
      <div class="container-fluid position-relative">
        <div class="row bg-img-gradiant-1">
          <div class="col-12"></div>
        </div>
        <div class="row bg-img-gradiant-2">
          <div class="col-12"></div>
        </div>
      </div>

      <!-- CENTERED CONTENT: USE .container -->
      <div class="container position-absolute content-center">
        <div class="row">
          <div
            class="col-12 header-logo d-flex justify-content-center align-items-center">
            <img src="../images/heading_logo.png" alt />
          </div>
        </div>
        <div class="row">
          <div
            class="col-12 header-horizontalline d-flex justify-content-center align-items-center">
            <img src="../images/Line 41.png" alt />
          </div>
        </div>
        <div class="row heading-left-content">
          <div class="col-12 col-lg-6 col-md-6">
            Dedicated Offshore Development, Built for Australia
          </div>
          <!-- <div class="col-12 col-lg-2 col-md-6 d-none d-md-block"></div> -->
          <div
            class="col-12 col-lg-6 col-md-6 d-none d-md-block header-right-content">
            <p class>High-performance web solutions powered by WordPress,
              Shopify, Laravel, Webflow & more</p>
            <div class="mb-2"><button>Get a Free Quote<img class="ps-2"
                  src="../images/button_forward_arrow.png" alt></button>
              <button class="btn-view-our">View Our Work<img class="ps-2"
                  src="../images/button_forward_arrow_2.png" alt></button></div>
            <img src="../images/short-line.png" class="d-inline-block" alt>
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h2 class="head-project-detail-font font-bold">500+</h2>
                <p class="head-project-detail-text-font">Projects Delivered</p>
              </div>
              <div>
                <h2 class="head-project-detail-font font-bold">100%</h2>
                <p class="head-project-detail-text-font">Client Satisfied</p>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 position-absolute header-main-image">
            <img src="../images/header-main-image.png" alt>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
